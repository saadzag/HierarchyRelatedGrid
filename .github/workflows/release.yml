# Builds the managed and unmanaged solutions and publishes them as a GitHub release.
# Trigger: push a tag like v1.2.3  ->  git tag v1.2.3 && git push origin v1.2.3
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Control version (manifest) and solution version (Solution.xml) follow the tag.
          $manifest = "HierarchyRelatedGrid/ControlManifest.Input.xml"
          (Get-Content $manifest -Raw) -replace '(<control [^>]*?\bversion=")[^"]+(")', "`${1}$version`${2}" | Set-Content $manifest -NoNewline
          $solution = "Solution/src/Other/Solution.xml"
          (Get-Content $solution -Raw) -replace '<Version>[^<]+</Version>', "<Version>$version</Version>" | Set-Content $solution -NoNewline

      - name: Build solutions (managed + unmanaged)
        run: dotnet build Solution/Solution.cdsproj -c Release

      - name: Rename artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item Solution/bin/Release/Solution.zip "release/HierarchyRelatedGrid_${env:VERSION}_unmanaged.zip"
          Copy-Item Solution/bin/Release/Solution_managed.zip "release/HierarchyRelatedGrid_${env:VERSION}_managed.zip"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: HierarchyRelatedGrid ${{ env.VERSION }}
          generate_release_notes: true
          files: release/*.zip
